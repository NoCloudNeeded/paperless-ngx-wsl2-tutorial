version: "3.8"

services:
  paperless-ngx:
    image: ghcr.io/paperless-ngx/paperless-ngx:latest
    container_name: paperless-webserver
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      PAPERLESS_REDIS: redis://redis:6379
      PAPERLESS_DBENGINE: postgresql
      PAPERLESS_DBHOST: postgres
      PAPERLESS_DBPORT: 5432
      PAPERLESS_DBNAME: paperless
      PAPERLESS_DBUSER: paperless
      PAPERLESS_DBPASS: paperless
      PAPERLESS_TIME_ZONE: America/New_York
      PAPERLESS_OCR_LANGUAGE: eng
      PAPERLESS_URL: http://localhost:8000
      PAPERLESS_SECRET_KEY: ${PAPERLESS_SECRET_KEY:-change-this-to-a-secure-random-64-char-string}
      USERMAP_UID: 1000
      USERMAP_GID: 1000
    volumes:
      - /home/youtube/paperless-ngx/data:/usr/src/paperless/data
      - /home/youtube/paperless-ngx/media:/usr/src/paperless/media
      - /home/youtube/paperless-ngx/export:/usr/src/paperless/export
      - /home/youtube/paperless-ngx/consume:/usr/src/paperless/consume
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_started

  redis:
    image: docker.io/library/redis:7
    container_name: paperless-redis
    restart: unless-stopped
    volumes:
      - /home/youtube/paperless-ngx/redisdata:/data

  postgres:
    image: docker.io/library/postgres:15-alpine
    container_name: paperless-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: paperless
      POSTGRES_USER: paperless
      POSTGRES_PASSWORD: paperless
    volumes:
      - /home/youtube/paperless-ngx/pgdata:/var/lib/postgresql/data
